<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS BOX MODEL</title>
    <style>
      .box {
        background-color: aqua;
      }
      .box1 {
        color: blue;
        padding: 50px;
        margin: 10px;
        border: 2px solid black;
        height: 100px;
      }
      .box2 {
        color: red;
        padding: 50px;
        margin: 10px;
        border: 2px solid black;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="box box1">
      <h1>This is a simple box with padding and margin.</h1>
    </div>
    <div class="box box2"><h1>I am another Box</h1></div>
  </body>
</html>
