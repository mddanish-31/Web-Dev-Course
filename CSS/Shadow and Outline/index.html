<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body{
            background-color: rgb(14, 13, 14);
        }
      .box {
        box-shadow: 10px 15px 100px rgb(166, 118, 58);
        border: 2px solid black;
        padding: 35px;
        margin: 45px;
        background-color: bisque;
        font-family: "Times New Roman", Times, serif;
        text-transform: capitalize;
        text-align: center;
        font-size: larger;
        height: 100px;
        font-size: 40px;
        outline:3px dashed black;
        outline-offset: 3px;
      }
      .text-element {
        text-shadow: 2px 2px 2px red;
        font-family: "Times New Roman", Times, serif;
        text-transform: capitalize;
        border: 2px solid black;
        padding: 35px;
        margin: 45px;
        text-align: center;
        background-color: hotpink;
        box-shadow: 5px 10px 100px red;
        font-size: larger;
        height: 100px;
        font-size: 40px;
        outline:3px dashed black;
        outline-offset: 3px;
      }
      .glow {
        font-family: "Times New Roman", Times, serif;
        text-transform: capitalize;
        border: 2px solid black;
        padding: 35px;
        margin: 45px;
        text-align: center;
        background-color: rgb(34, 166, 65);
        box-shadow: 5px 10px 100px rgb(218, 69, 69);
        font-size: larger;
        height: 100px;
        font-size: 40px;
        color: white;
        text-shadow:
          0 0 10px rgb(145, 34, 52),
          0 0 20px rgb(145, 34, 52),
          0 0 30px rgb(145, 34, 52);
          outline:3px dashed black;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="box">i am a box</div>
    <div class="text-element">
      <p>my name is md danish raza</p>
    </div>
    <div class="glow">i am glowing</div>
  </body>
</html>
