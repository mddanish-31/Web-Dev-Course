<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTRODUCTION TO CSS--- Codewithdanish</title>
</head>
<style>
    body {
        font-family: 'Times New Roman', Times, serif, sans-serif;
        margin: 20px;
        background-color: #db8dca;
    }

    h1 {
        color: #020000;
        text-align: center;
    }

    h2 {
        color: #100606;
    }

    p {
        line-height: 1.6;
        color: #1a0303;
    }
</style>
<body>
    <h1>INTRODUCTION TO CSS</h1>
    <div>
        <h2>What is CSS?</h2>
        <p>CSS (Cascading Style Sheets) is a stylesheet language used to describe the presentation of a document written in HTML or XML. It allows you to control the layout, colors, fonts, and overall appearance of web pages.</p>
    </div>
</body>
</html>
