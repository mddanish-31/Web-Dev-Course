<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        h1{
            color: red;
        }
        ol{
            color: #8B2B84;
            color:rgb(139, 43, 132)
            color:rgba(139, 43, 132, 0.5)
            color:hsl(300, 60%, 50%)
            color:hsl(300, 60%, 50%, 0.5)
            color:hsla(300, 60%, 50%, 0.5)
        }
        body{
            background-color:rgba(50, 234, 145, 0.482)
        }
    </style>
</head>
<body>
    <h1>Lets learn About Colors</h1>
    <p>Colors Can be Represented in:</p>
    <ol>
        <li>Colors Keyword</li>
        <li>Hex Color Code</li>
        <li>RGB Color Code</li>
        <li>RGBA</li>
        <li>HSL</li>
    </ol>
</body>
</html>
