<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Property</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .box {
        display: inline-flex;
        border: 2px solid black;
        padding: 45px;
        margin:10px;
        background-color: aqua;
        text-align: center;
        text-transform: capitalize;
        font-family: 'Times New Roman', Times, serif;
      }
        .box1 {
          display: inline-block;
          border: 2px solid black;
          padding: 45px;
          margin:10px;
          text-align: center;
          text-transform: capitalize;
          background-color: burlywood;
          font-family: 'Times New Roman', Times, serif;
        }
        .box2{
            display: inline-block;
          border: 2px solid black;
          padding: 45px;
          margin:10px;
          text-align: center;
          text-transform: capitalize;
          background-color:darkorchid;
          font-family: 'Times New Roman', Times, serif;
        }
    </style>
  </head>
  <body>
    <div class="box">i am a box</div>
    <div class="box1">i have too much of space</div>
    <div class="box2">i am another box</div>
  </body>
</html>
